name: Owned native bootstrap
description: Authenticate the published owner and compile the independent std-only hosted Rust driver
inputs:
  target:
    description: Exact native runner target
    required: true
  coverage:
    description: Install the pinned instrumented toolchain too
    default: 'false'
  build-task:
    description: Build the locked task runner; only source-preparation may disable this
    default: 'true'
runs:
  using: composite
  steps:
    - name: Refuse any unsupported seed identity or preparation privilege
      if: >-
        github.repository != 'KiaroSama/Numera-Gen-MCP' ||
        (github.event_name != 'workflow_dispatch' && github.event_name != 'push' && github.event_name != 'pull_request') ||
        fromJSON('{"Windows-X64":"x86_64-pc-windows-msvc","Windows-ARM64":"aarch64-pc-windows-msvc","Linux-X64":"x86_64-unknown-linux-gnu","Linux-ARM64":"aarch64-unknown-linux-gnu","macOS-X64":"x86_64-apple-darwin","macOS-ARM64":"aarch64-apple-darwin"}')[format('{0}-{1}', runner.os, runner.arch)] != inputs.target ||
        (inputs.coverage != 'true' && inputs.coverage != 'false') ||
        (inputs.build-task != 'true' && inputs.build-task != 'false') ||
        (inputs.build-task == 'false' && (github.job != 'source-preparation' || env.NUMERA_CI_OPERATION != 'source-preparation' || inputs.coverage != 'false')) ||
        (env.NUMERA_CI_OPERATION == 'source-preparation' && (inputs.build-task != 'false' || inputs.coverage != 'false' || github.job != 'source-preparation'))
      shell: bash
      run: 'false'
    # Fixed pre-Rust seed only: no first-party shell decisions, loops or generated programs.
    - name: Create exclusive seed workspace
      shell: bash
      run: |
        mkdir -p .ci-work/temp .ci-cache/cargo .ci-cache/rustup
        mkdir .ci-work/bootstrap
    - name: Download only the selected immutable owner archive
      shell: bash
      env:
        BOOTSTRAP_PREFIX: numera-image-gen-mcp-0.2.0-${{ inputs.target }}
        BOOTSTRAP_SUFFIX: ${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
      run: >-
        curl --disable --fail --location --max-redirs 3 --proto '=https' --proto-redir '=https'
        --connect-timeout 10 --max-time 90 --speed-time 30 --speed-limit 1024
        --max-filesize 16777216 --noproxy '*' --proxy '' --output .ci-work/bootstrap/owner.archive
        "https://github.com/KiaroSama/Numera-Gen-MCP/releases/download/v0.2.0/$BOOTSTRAP_PREFIX.$BOOTSTRAP_SUFFIX"
    - name: Authenticate immutable owner on Windows and Linux
      if: runner.os != 'macOS'
      shell: bash
      env:
        BOOTSTRAP_SHA256: ${{ fromJSON('{"x86_64-pc-windows-msvc":"0128674d9c1a0aad8eb111dc4e45e7def89119f22369089d73729905a315e658","aarch64-pc-windows-msvc":"e132f203a88251f3fa4e22a2bdfd7a25261453bc95af55a39f056c364ac0f8e0","x86_64-unknown-linux-gnu":"51a089b26e3bf9cdbf0631a56ee4644d96babc3ff3f1e0c1dab8948c53bbd56d","aarch64-unknown-linux-gnu":"62a07c39d57a18afe9dd144c722300b966b14655141655c60d300b89f5e7ad66"}')[inputs.target] }}
      run: printf '%s  %s\n' "$BOOTSTRAP_SHA256" .ci-work/bootstrap/owner.archive | sha256sum -c -
    - name: Authenticate immutable owner on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        BOOTSTRAP_SHA256: ${{ fromJSON('{"x86_64-apple-darwin":"e2143157034ae30d2dbe6954e30fd76c8036c412a3b7407db83441e53b484d00","aarch64-apple-darwin":"cb26ee662e19fbc12f33209e988a55817fb7dcbe0d94a1836c3475b8dc55cdc7"}')[inputs.target] }}
      run: printf '%s  %s\n' "$BOOTSTRAP_SHA256" .ci-work/bootstrap/owner.archive | shasum -a 256 -c -
    - name: Extract only authenticated Windows developer owner
      if: runner.os == 'Windows'
      shell: bash
      env:
        BOOTSTRAP_PREFIX: numera-image-gen-mcp-0.2.0-${{ inputs.target }}
      run: '"$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -xf .ci-work/bootstrap/owner.archive -C .ci-work/bootstrap "$BOOTSTRAP_PREFIX/bin/numera-dev.exe"'
    - name: Extract only authenticated POSIX developer owner
      if: runner.os != 'Windows'
      shell: bash
      env:
        BOOTSTRAP_PREFIX: numera-image-gen-mcp-0.2.0-${{ inputs.target }}
      run: tar -xf .ci-work/bootstrap/owner.archive -C .ci-work/bootstrap "$BOOTSTRAP_PREFIX/bin/numera-dev"
    - name: Compile the independent Rust bootstrap under the authenticated owner
      shell: bash
      env:
        SEED_OWNER: ${{ github.workspace }}/.ci-work/bootstrap/numera-image-gen-mcp-0.2.0-${{ inputs.target }}/bin/numera-dev${{ runner.os == 'Windows' && '.exe' || '' }}
        SEED_DRIVER: ${{ github.workspace }}/.ci-work/bootstrap/numera-bootstrap${{ runner.os == 'Windows' && '.exe' || '' }}
        RUSTUP_DIST_SERVER: https://static.rust-lang.org
        RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
        RUSTUP_TERM_COLOR: never
      run: |
        chmod 700 "$SEED_OWNER"
        "$SEED_OWNER" bounded 600000 180000 --exec env -u RUSTUP_TOOLCHAIN rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
        "$SEED_OWNER" bounded 30000 20000 --exec env -u RUSTUP_TOOLCHAIN rustup default 1.99.1
        "$SEED_OWNER" bounded 120000 45000 --exec env -u RUSTUP_TOOLCHAIN rustup run 1.99.1 rustc --edition=2024 --crate-type=bin tooling/bootstrap/main.rs -o "$SEED_DRIVER"
    - name: Validate Rust bootstrap policy and export exact owned paths
      shell: bash
      env:
        BOOTSTRAP_TARGET: ${{ inputs.target }}
        BOOTSTRAP_COVERAGE: ${{ inputs.coverage }}
        BOOTSTRAP_BUILD_TASK: ${{ inputs.build-task }}
        SEED_OWNER: ${{ github.workspace }}/.ci-work/bootstrap/numera-image-gen-mcp-0.2.0-${{ inputs.target }}/bin/numera-dev${{ runner.os == 'Windows' && '.exe' || '' }}
        SEED_DRIVER: ${{ github.workspace }}/.ci-work/bootstrap/numera-bootstrap${{ runner.os == 'Windows' && '.exe' || '' }}
      run: |
        "$SEED_OWNER" bounded 30000 20000 --exec "$SEED_DRIVER" validate
        "$SEED_OWNER" bounded 30000 20000 --exec "$SEED_DRIVER" export
    - name: Install the selected instrumented toolchain under the native owner
      if: inputs.coverage == 'true'
      shell: bash
      env:
        BOOTSTRAP_TARGET: ${{ inputs.target }}
        BOOTSTRAP_COVERAGE: ${{ inputs.coverage }}
        BOOTSTRAP_BUILD_TASK: ${{ inputs.build-task }}
      run: '"$NUMERA_BOOTSTRAP_OWNER" bounded 600000 180000 --exec "$NUMERA_BOOTSTRAP_DRIVER" coverage-toolchain'
    - name: Verify the pinned compiler frontend
      shell: bash
      env:
        BOOTSTRAP_TARGET: ${{ inputs.target }}
        BOOTSTRAP_COVERAGE: ${{ inputs.coverage }}
        BOOTSTRAP_BUILD_TASK: ${{ inputs.build-task }}
      run: '"$NUMERA_BOOTSTRAP_OWNER" bounded 30000 20000 --exec "$NUMERA_BOOTSTRAP_DRIVER" version'
    - name: Build the exact locked workspace task once
      if: inputs.build-task == 'true'
      shell: bash
      env:
        BOOTSTRAP_TARGET: ${{ inputs.target }}
        BOOTSTRAP_COVERAGE: ${{ inputs.coverage }}
        BOOTSTRAP_BUILD_TASK: ${{ inputs.build-task }}
        BOOTSTRAP_IDLE: ${{ runner.os == 'macOS' && '360000' || '180000' }}
      run: '"$NUMERA_BOOTSTRAP_OWNER" bounded 900000 "$BOOTSTRAP_IDLE" --exec "$NUMERA_BOOTSTRAP_DRIVER" build-task'
