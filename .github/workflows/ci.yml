name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NUMERA_TEST_WORKERS: "2"
      npm_config_cache: ${{ github.workspace }}/.ci-cache/npm
      TEMP: ${{ github.workspace }}/.ci-work/temp
      TMP: ${{ github.workspace }}/.ci-work/temp
      TMPDIR: ${{ github.workspace }}/.ci-work/temp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Create project-contained work directories
        shell: bash
        run: mkdir -p .ci-work/temp .ci-cache/npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fc7da25c3b470199949b1b4c67127d77afa0c34a
          path: .ci-work/baseline
      - name: Install frozen oracle dependencies only
        run: npm --prefix .ci-work/baseline ci --no-audit --no-fund
      - name: Check current native repository hygiene
        run: node scripts/check.mjs
      - name: Check current CI scripts, schemas, examples and documentation formatting
        run: node .ci-work/baseline/node_modules/prettier/bin/prettier.cjs --check --ignore-unknown scripts tests/tooling examples schemas docs "*.md" .github
      - name: Check frozen source types, lint and build
        run: npm --prefix .ci-work/baseline run check
      - name: Check frozen source formatting
        run: npm --prefix .ci-work/baseline run format:check
      - name: Execute frozen source coverage
        run: npm --prefix .ci-work/baseline run coverage
      - name: Verify frozen source stdio
        run: npm --prefix .ci-work/baseline run smoke
      - name: Verify frozen source packed installation
        run: npm --prefix .ci-work/baseline run package:check
      - name: Audit frozen production dependencies
        run: npm --prefix .ci-work/baseline audit --omit=dev
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      NUMERA_TEST_WORKERS: "2"
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
      npm_config_cache: ${{ github.workspace }}/.ci-cache/npm
      TEMP: ${{ github.workspace }}/.ci-work/temp
      TMP: ${{ github.workspace }}/.ci-work/temp
      TMPDIR: ${{ github.workspace }}/.ci-work/temp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create project-contained work directories
        shell: bash
        run: mkdir -p .ci-work/temp .ci-cache/npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fc7da25c3b470199949b1b4c67127d77afa0c34a
          path: .ci-work/baseline
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Generate pinned-source compatibility oracle
        shell: bash
        env:
          NUMERA_ORACLE_ROOT: ${{ github.workspace }}/.ci-work/baseline
        run: |
          npm --prefix .ci-work/baseline ci --no-audit --no-fund
          npm --prefix .ci-work/baseline run build
          node scripts/rust-oracle.mjs
      - name: Install official Rust only inside workspace
        run: python -B scripts/native-setup.py
      - name: Native stable quality, parity, tests and release build
        env:
          NUMERA_ORACLE_ROOT: ${{ github.workspace }}/.ci-work/baseline
          NUMERA_COLLECT_SOURCE_CASES: ${{ matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' }}
        run: python -B scripts/native-ci.py stable
      - name: Preserve exact synthetic oracle inputs and execution provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-oracle-${{ matrix.target }}
          path: .ci-work/native/oracle-evidence.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve expanded frozen case inventory including platform skips
        if: always() && (matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-cases-${{ matrix.target }}
          path: .ci-work/parity/source-cases.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve resolved dependency licenses and bundled notices
        id: native_licenses
        env:
          NUMERA_NATIVE_TARGET: ${{ matrix.target }}
        run: python -B scripts/native-licenses.py
      # Internal compiler intermediates only; final signed distribution remains a separate gate.
      - name: Package explicitly labeled internal compiler intermediate
        run: python -B scripts/native-package.py --intermediate --target ${{ matrix.target }}
      - name: Verify extracted internal intermediate without source runtime dependencies
        env:
          NUMERA_ORACLE_ROOT: ${{ github.workspace }}/.ci-work/baseline
        run: python -B scripts/native-extract-check.py --intermediate
      - name: Preserve internal intermediates, not completed signed builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-unsigned-intermediate-${{ matrix.target }}
          path: .ci-work/intermediate/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve formatting evidence without accepting a failed check
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-format-${{ matrix.target }}
          path: .ci-work/native/formatting.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve sanitized dependency notice failures
        if: failure() && steps.native_licenses.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-license-failures-${{ matrix.target }}
          path: .ci-work/native/licenses/failures.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve real generated lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lock-${{ matrix.target }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
  native-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NUMERA_TEST_WORKERS: "2"
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
      npm_config_cache: ${{ github.workspace }}/.ci-cache/npm
      TEMP: ${{ github.workspace }}/.ci-work/temp
      TMP: ${{ github.workspace }}/.ci-work/temp
      TMPDIR: ${{ github.workspace }}/.ci-work/temp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create project-contained work directories
        run: mkdir -p .ci-work/temp .ci-cache/npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fc7da25c3b470199949b1b4c67127d77afa0c34a
          path: .ci-work/baseline
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Generate pinned-source compatibility oracle
        env:
          NUMERA_ORACLE_ROOT: ${{ github.workspace }}/.ci-work/baseline
        run: |
          npm --prefix .ci-work/baseline ci --no-audit --no-fund
          npm --prefix .ci-work/baseline run build
          node scripts/rust-oracle.mjs
      - name: Install stable and isolated nightly coverage toolchains
        run: python -B scripts/native-setup.py --coverage
      - name: Enforce native 85 percent regions and 80 percent branches
        env:
          NUMERA_ORACLE_ROOT: ${{ github.workspace }}/.ci-work/baseline
        run: python -B scripts/native-ci.py coverage
      - name: Preserve exact instrumented oracle inputs and execution provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-oracle-coverage
          path: .ci-work/native/oracle-evidence.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-coverage
          path: .ci-work/native/coverage.json
          if-no-files-found: error
          retention-days: 7
