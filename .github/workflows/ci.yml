name: CI
run-name: ${{ inputs.operation == 'qualify' && 'Tests' || inputs.operation == 'source-preparation' && 'Source preparation' || 'Signing' }} / ${{ github.ref_name }} / ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Qualification, approved same-source signing, or isolated source preparation
        type: choice
        required: true
        default: qualify
        options:
          - qualify
          - source-preparation
          - sign-qualified
      qualification-run-id:
        description: Original successful qualification run ID, only for sign-qualified
        type: string
        required: false
      qualification-run-attempt:
        description: Exact original successful attempt, only for sign-qualified
        type: string
        required: false
      retirement-parent-run-id:
        description: Completed signed qualification run for the exact retirement parent
        type: string
        required: false
      retirement-parent-run-attempt:
        description: Exact successful signed qualification attempt for the retirement parent
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.operation }}
  cancel-in-progress: false
env:
  NUMERA_TEST_WORKERS: "2"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"
  CARGO_TERM_COLOR: never
  CARGO_HOME: ${{ github.workspace }}/.ci-cache/cargo
  RUSTUP_HOME: ${{ github.workspace }}/.ci-cache/rustup
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  TEMP: ${{ github.workspace }}/.ci-work/temp
  TMP: ${{ github.workspace }}/.ci-work/temp
  TMPDIR: ${{ github.workspace }}/.ci-work/temp
  NUMERA_BUILD_SHA: ${{ github.sha }}
  NUMERA_CI_OPERATION: ${{ inputs.operation || 'qualify' }}
  NUMERA_QUALIFICATION_RUN_ID: ${{ inputs.qualification-run-id }}
  NUMERA_QUALIFICATION_RUN_ATTEMPT: ${{ inputs.qualification-run-attempt }}
jobs:
  source-preparation:
    if: inputs.operation == 'source-preparation' && github.repository == 'KiaroSama/Numera-Gen-MCP' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bootstrap the existing owner without compiling the unresolved workspace
        uses: ./.github/actions/native-bootstrap
        timeout-minutes: 12
        with:
          target: x86_64-unknown-linux-gnu
          build-task: 'false'
      - name: Resolve and format source only, never qualify or sign
        timeout-minutes: 7
        env:
          BOOTSTRAP_TARGET: x86_64-unknown-linux-gnu
          BOOTSTRAP_COVERAGE: 'false'
          BOOTSTRAP_BUILD_TASK: 'false'
        run: |
          "$NUMERA_BOOTSTRAP_OWNER" bounded 30000 20000 --exec "$NUMERA_BOOTSTRAP_DRIVER" prepare-checkout
          "$NUMERA_BOOTSTRAP_OWNER" bounded 240000 60000 --exec "$NUMERA_BOOTSTRAP_DRIVER" prepare-lock
          "$NUMERA_BOOTSTRAP_OWNER" bounded 120000 45000 --exec "$NUMERA_BOOTSTRAP_DRIVER" prepare-format
          "$NUMERA_BOOTSTRAP_OWNER" bounded 120000 45000 --exec "$NUMERA_BOOTSTRAP_DRIVER" prepare-format-check
          "$NUMERA_BOOTSTRAP_OWNER" bounded 30000 20000 --exec "$NUMERA_BOOTSTRAP_DRIVER" prepare-package
      - name: Return only reviewed source-preparation candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-preparation
          path: |
            .ci-work/source-preparation/source-preparation.patch
            .ci-work/source-preparation/receipt.json
            .ci-work/source-preparation/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'qualify'
    permissions:
      contents: read
      statuses: write
    name: native-${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap under the authenticated native process owner
        uses: ./.github/actions/native-bootstrap
        timeout-minutes: 30
        with:
          target: ${{ matrix.target }}
      - name: Materialize independent immutable expected inputs
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" fixtures
      - name: Create same-user native DPAPI interoperability fixture
        if: runner.os == 'Windows'
        timeout-minutes: 1
        run: '"$NUMERA_BOOTSTRAP_OWNER" bounded 30000 15000 --exec ./target/debug/numera-task --root "$GITHUB_WORKSPACE" dpapi-fixture'
      - name: Bind current dependency and fixture provenance
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" evidence-capture
      - name: Native workspace quality, complete suite discovery and actual SDK execution
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" stable
      - name: Preserve actual runtime dependency notices
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" licenses '${{ matrix.target }}'
      - name: Package explicitly unsigned internal compiler intermediate
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" prepare '${{ matrix.target }}'
      - name: Exercise extracted intermediate with actual stdio, HTTP and media SDK
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" extract-intermediate '${{ matrix.target }}'
      - name: Bind every original case to current exact execution without semantic promotion
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" case-execution
      - name: Preserve diagnostic formatting candidates without clearing failure
        if: failure() && hashFiles('.ci-work/native/formatting.zip') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-format-${{ matrix.target }}
          path: .ci-work/native/formatting.zip
          if-no-files-found: error
          retention-days: 7
      - name: Preserve exact native test execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-execution-${{ matrix.target }}
          path: |
            .ci-work/native/test-execution.json
            .ci-work/native/sdk-execution-*.json
            .ci-work/native/current-case-execution.json
            .ci-work/native/current-source-case-rebind-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve exact fixture provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-oracle-${{ matrix.target }}
          path: .ci-work/native/oracle-evidence.zip
          if-no-files-found: error
          retention-days: 7
      - name: Preserve compiler intermediate, never a completed signed build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-unsigned-intermediate-${{ matrix.target }}
          path: .ci-work/intermediate/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish real native test status beside the commit
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERA_OBSERVED_JOB_STATUS: ${{ job.status }}
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" commit-status "$NUMERA_OBSERVED_JOB_STATUS" '${{ matrix.target }}'
  native-coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'qualify'
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap stable and instrumented toolchains under the native owner
        uses: ./.github/actions/native-bootstrap
        timeout-minutes: 40
        with:
          target: x86_64-unknown-linux-gnu
          coverage: 'true'
      - name: Materialize original expected bytes and provenance
        run: |
          ./target/debug/numera-task --root "$GITHUB_WORKSPACE" fixtures
          ./target/debug/numera-task --root "$GITHUB_WORKSPACE" evidence-capture
      - name: Run instrumented runtime and actual SDK, enforce unchanged 85/80 floors
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" coverage
      - name: Bind original cases to exact instrumented execution
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" case-execution
      - name: Preserve exact instrumented test execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-execution-coverage
          path: |
            .ci-work/native/test-execution.json
            .ci-work/native/sdk-execution-*.json
            .ci-work/native/current-case-execution.json
            .ci-work/native/current-source-case-rebind-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve measured coverage, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-coverage
          path: .ci-work/native/coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve instrumented original-input provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-oracle-coverage
          path: .ci-work/native/oracle-evidence.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish real coverage status beside the commit
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERA_OBSERVED_JOB_STATUS: ${{ job.status }}
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" commit-status "$NUMERA_OBSERVED_JOB_STATUS" none
  execution-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'qualify'
    needs: [native, native-coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: write
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap the native evidence collector
        uses: ./.github/actions/native-bootstrap
        timeout-minutes: 30
        with:
          target: x86_64-unknown-linux-gnu
      - name: Authenticate all seven current named execution contexts
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$NUMERA_BOOTSTRAP_OWNER" bounded 900000 60000 --exec ./target/debug/numera-task --root "$GITHUB_WORKSPACE" execution-matrix'
      - name: Preserve authenticated execution-only matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-execution-matrix
          path: .ci-work/native/execution-matrix.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish authenticated test collection status beside the commit
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERA_OBSERVED_JOB_STATUS: ${{ job.status }}
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" commit-status "$NUMERA_OBSERVED_JOB_STATUS" none
  signing:
    name: signing-${{ matrix.target }}
    needs: [native, native-coverage, execution-matrix]
    # Existing-key main signing only; source preparation never enters this environment.
    if: >-
      !cancelled() && github.repository == 'KiaroSama/Numera-Gen-MCP' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      ((inputs.operation == 'qualify' && needs.native.result == 'success' &&
        needs.native-coverage.result == 'success' && needs.execution-matrix.result == 'success') ||
       (inputs.operation == 'sign-qualified' && needs.native.result == 'skipped' &&
        needs.native-coverage.result == 'skipped' && needs.execution-matrix.result == 'skipped'))
    environment: numera-signing
    permissions:
      contents: read
      actions: read
      statuses: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap the signing runner under the native owner
        uses: ./.github/actions/native-bootstrap
        timeout-minutes: 30
        with:
          target: ${{ matrix.target }}
      - name: Prepare independent fixture inputs and compiled acceptance inventory
        run: |
          ./target/debug/numera-task --root "$GITHUB_WORKSPACE" acceptance-prepare
          ./target/debug/numera-task --root "$GITHUB_WORKSPACE" evidence-capture
      - name: Authenticate exact original qualification and select its intermediate
        id: source
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$NUMERA_BOOTSTRAP_OWNER" bounded 420000 60000 --exec ./target/debug/numera-task --root "$GITHUB_WORKSPACE" signing-source '${{ matrix.target }}'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact-id }}
          run-id: ${{ steps.source.outputs.run-id }}
          repository: KiaroSama/Numera-Gen-MCP
          github-token: ${{ github.token }}
          path: .ci-work/signing-download
          digest-mismatch: error
      - name: Authenticate complete intermediate and qualify native signing tools
        run: |
          ./target/debug/numera-task --root "$GITHUB_WORKSPACE" stage '${{ matrix.target }}'
          ./target/debug/numera-task --root "$GITHUB_WORKSPACE" signing-tools '${{ matrix.target }}'
      - name: Sign with selected protected inputs, then dispose them
        env:
          NUMERA_SIGNING_PFX_BASE64: ${{ secrets.NUMERA_SIGNING_PFX_BASE64 }}
          NUMERA_SIGNING_PASSWORD: ${{ secrets.NUMERA_SIGNING_PASSWORD }}
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" sign '${{ matrix.target }}'
      - name: Genuine signature positives, wrong signer, unsigned and tampered negatives
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" signature-acceptance '${{ matrix.target }}'
      - name: Package verified signed bytes and test extracted activation and SDK
        run: |
          ./target/debug/numera-task --root "$GITHUB_WORKSPACE" package '${{ matrix.target }}'
          ./target/debug/numera-task --root "$GITHUB_WORKSPACE" extract-signed '${{ matrix.target }}'
      - name: Preserve exact signed extracted SDK execution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-execution-signed-${{ matrix.target }}
          path: |
            .ci-work/native/signing-source.json
            .ci-work/native/signature-execution.json
            .ci-work/native/signed-extraction-execution.json
            .ci-work/native/sdk-execution-extracted-signed.json
            .ci-work/native/oracle-evidence.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-signed-${{ matrix.target }}
          path: .ci-work/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish real native signing status beside the commit
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERA_OBSERVED_JOB_STATUS: ${{ job.status }}
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" commit-status "$NUMERA_OBSERVED_JOB_STATUS" '${{ matrix.target }}'
  signed-execution-matrix:
    if: >-
      !cancelled() && needs.signing.result == 'success' &&
      github.repository == 'KiaroSama/Numera-Gen-MCP' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      ((inputs.operation == 'qualify' && needs.native.result == 'success' &&
        needs.native-coverage.result == 'success' && needs.execution-matrix.result == 'success') ||
       (inputs.operation == 'sign-qualified' && needs.native.result == 'skipped' &&
        needs.native-coverage.result == 'skipped' && needs.execution-matrix.result == 'skipped'))
    needs: [native, native-coverage, execution-matrix, signing]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: write
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap the public signed execution collector
        uses: ./.github/actions/native-bootstrap
        timeout-minutes: 30
        with:
          target: x86_64-unknown-linux-gnu
      - name: Bind original signed bytes and all six actual native acceptance contexts
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$NUMERA_BOOTSTRAP_OWNER" bounded 900000 60000 --exec ./target/debug/numera-task --root "$GITHUB_WORKSPACE" signed-execution-matrix'
      - name: Preserve authenticated signed execution and separate final qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-signed-execution-matrix
          path: |
            .ci-work/native/signed-execution-matrix.json
            .ci-work/native/current-qualification.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish authenticated signed qualification status beside the commit
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERA_OBSERVED_JOB_STATUS: ${{ job.status }}
        run: ./target/debug/numera-task --root "$GITHUB_WORKSPACE" commit-status "$NUMERA_OBSERVED_JOB_STATUS" none
  retirement-verification:
    if: >-
      !cancelled() && needs.signed-execution-matrix.result == 'success' &&
      github.repository == 'KiaroSama/Numera-Gen-MCP' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'qualify' || inputs.operation == 'sign-qualified') &&
      (inputs.retirement-parent-run-id != '' || inputs.retirement-parent-run-attempt != '')
    needs: [signed-execution-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap the read-only retirement verifier
        uses: ./.github/actions/native-bootstrap
        timeout-minutes: 30
        with:
          target: x86_64-unknown-linux-gnu
      - name: Authenticate parent and current qualification without deleting source
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERA_RETIREMENT_RUN_ID: ${{ inputs.retirement-parent-run-id }}
          NUMERA_RETIREMENT_RUN_ATTEMPT: ${{ inputs.retirement-parent-run-attempt }}
        run: '"$NUMERA_BOOTSTRAP_OWNER" bounded 900000 60000 --exec ./target/debug/numera-task --root "$GITHUB_WORKSPACE" retirement-gate'
