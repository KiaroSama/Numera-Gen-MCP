[package]
name = "numera-task"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[dependencies]
numera-gen-mcp = { path = ".." }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v4"] }
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
