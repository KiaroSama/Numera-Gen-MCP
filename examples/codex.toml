tool_timeout_sec = 360
env = { NUMERA_CONFIG = "C:/tools/numera-gen-mcp/.env", TEMP = "C:/tools/numera-gen-mcp/.runtime/temp", TMP = "C:/tools/numera-gen-mcp/.runtime/temp", TMPDIR = "C:/tools/numera-gen-mcp/.runtime/temp" }
